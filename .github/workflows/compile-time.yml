name: Compile time A/B

on:
  pull_request:
    branches: [v2]
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline git ref (must exist in this repository)
        required: true
        default: v2
      candidate:
        description: Candidate git ref (must exist in this repository)
        required: true
        default: groundwork/cxx23-integration

permissions:
  contents: read

jobs:
  compile-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harness contracts
        run: python3 tests/compile_time/test_compare.py
      - name: Detect baseline language contract
        id: baseline
        run: |
          python3 - <<'PY'
          import os, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', '--verify', '--end-of-options', os.environ['BASELINE'] + '^{commit}'], text=True).strip()
          cmake = subprocess.check_output(['git', 'show', sha + ':CMakeLists.txt'], text=True)
          standard = 'c++17' if 'cxx_std_17' in cmake else 'c++23'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('standard=' + standard + '\n')
          PY
      - name: Same-language source comparison (C++23)
        run: |
          python3 tests/compile_time/compare.py --baseline "$BASELINE" --candidate "$CANDIDATE" \
            --baseline-standard c++23 --translation-units 8 \
            --json compile-time-source.json --markdown compile-time-source.md
      - name: Language migration comparison (C++17 to C++23)
        if: steps.baseline.outputs.standard == 'c++17'
        run: |
          python3 tests/compile_time/compare.py --baseline "$BASELINE" --candidate "$CANDIDATE" \
            --baseline-standard c++17 --translation-units 8 \
            --json compile-time-migration.json --markdown compile-time-migration.md
      - name: Publish timing summary
        if: always()
        run: |
          for report in compile-time-*.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-time-ab
          path: compile-time-*
