name: CI

on:
  push:
    branches: [develop, v2]
  pull_request:
    branches: [develop, v2, 'claude/**'] # claude/**: PRs stacked on another PR's branch

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-unix
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ci-unix
      - name: Test
        run: ctest --preset ci-unix

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-msvc
      - name: Build
        run: cmake --build --preset ci-msvc
      - name: Test
        run: ctest --preset ci-msvc
      - name: MSVC final-image evidence (static fan-out)
        run: python tests/collapse/collapse_evidence.py --build msvc-O2 --case many_receivers --json msvc-fanout.json > msvc-fanout.md
      - name: MSVC final-image evidence (cross-file LTCG)
        run: python tests/collapse/collapse_evidence.py --build msvc-O2-lto --case cross_file --json msvc-ltcg.json > msvc-ltcg.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msvc-evidence-smoke
          path: |
            msvc-fanout.*
            msvc-ltcg.*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-unix
      - name: Build
        run: cmake --build --preset ci-unix
      - name: Test
        run: ctest --preset ci-unix

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ci-asan: Debug with assertions; ci-asan-release: -O2 -DNDEBUG (release-mode capacity contract, issue #4);
        # ci-tsan: data races, incl. the cross-thread teardown test (tests/design/broker_config/test_endpoints.cpp)
        preset: [ci-asan, ci-asan-release, ci-tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: gcc
          CXX: g++
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  collapse-evidence:
    # Issue #9: final-link evidence per case/variant/build (docs/design/COLLAPSE_EVIDENCE.md).
    # Fails on behaviour mismatch and on a public-API variant over its recorded budget (tests/collapse/budgets.json);
    # collapse criteria against hand-written code are reported (the runtime registry is expected to fail them).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchains
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind clang gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Collect evidence
        run: python3 tests/collapse/collapse_evidence.py --budgets tests/collapse/budgets.json --json collapse-evidence.json > collapse-evidence.md
      - name: Migration comparison (including mixed paths)
        run: python3 tests/compare/compare_versions.py > migration-comparison.md
      - name: Summary
        if: always()
        run: cat collapse-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collapse-evidence
          path: |
            collapse-evidence.*
            migration-comparison.md

